name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build-${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            os: linux
            arch: amd64
            archive: tar.gz
            bin_ext: ""
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            os: darwin
            arch: amd64
            archive: tar.gz
            bin_ext: ""
          - runner: macos-14
            target: aarch64-apple-darwin
            os: darwin
            arch: arm64
            archive: tar.gz
            bin_ext: ""
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            os: windows
            arch: amd64
            archive: zip
            bin_ext: ".exe"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package tar.gz asset
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          set -euo pipefail
          asset_name="wpygen_${{ matrix.os }}_${{ matrix.arch }}"
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/wpygen${{ matrix.bin_ext }}" "dist/wpygen"
          tar -C dist -czf "${asset_name}.tar.gz" wpygen

      - name: Package zip asset
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $assetName = "wpygen_${{ matrix.os }}_${{ matrix.arch }}"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/wpygen${{ matrix.bin_ext }}" "dist/wpygen.exe"
          Compress-Archive -Path "dist/wpygen.exe" -DestinationPath "$assetName.zip" -Force

      - name: Generate SHA-256 checksum
        shell: bash
        run: |
          set -euo pipefail
          asset_name="wpygen_${{ matrix.os }}_${{ matrix.arch }}.${{ matrix.archive }}"
          shasum -a 256 "$asset_name" > "$asset_name.sha256"

      - name: Upload release asset
        uses: softprops/action-gh-release@v3
        with:
          files: |
            wpygen_${{ matrix.os }}_${{ matrix.arch }}.${{ matrix.archive }}
            wpygen_${{ matrix.os }}_${{ matrix.arch }}.${{ matrix.archive }}.sha256
