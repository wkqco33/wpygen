[package]
name = "wpygen"
version = "0.5.0"
edition = "2024"
license = "MIT"
description = "uv 기반 Python 프로젝트 템플릿(CLI/GUI/SERVER) 생성기"
repository = "https://github.com/wkqco33/wpygen"

[dependencies]
wrcli = "0.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = { version = "2.10", features = ["json"] }
dirs = "6.0"
toml = "0.8"
